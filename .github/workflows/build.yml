name: Build AlfyDNS (ABI Split & Signed)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan project dari ZIP
        shell: bash
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE/_src"
          mkdir -p "$SRC"
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Mengekstrak $ZIP..."
            unzip -o -q "$ZIP" -d "$SRC"
          fi
          ROOT=$(find "$SRC" -maxdepth 6 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' -printf '%d %h\n' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$ROOT" ]; then
            echo "::error::settings.gradle(.kts) tidak ditemukan di dalam ZIP."
            exit 1
          fi
          echo "Project root: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Clone SlipNet & Instal Gomobile
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git clone https://github.com/anonvector/SlipNet.git /tmp/SlipNet
          cd /tmp/SlipNet
          git config --global submodule.dnstt-mobile.update none
          git submodule update --init --recursive
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $HOME/go/bin/gomobile init

      - name: Build Golibs AAR (Target Full)
        run: |
          cd /tmp/SlipNet
          make -C gomobile-build build-full
          cp app/libs/golibs-full.aar ${{ env.PROJECT_DIR }}/app/libs/golibs.aar

      - name: Hapus setSayeMode dari DnsttWrapper.kt
        run: |
          sed -i '/setSayeMode/d' ${{ env.PROJECT_DIR }}/app/src/main/java/com/alfydns/app/DnsttWrapper.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # PERBAIKAN: Generate Keystore & Build dengan ABI Split
      - name: Build Release APK (Signed & ABI Split)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # 1. Bikin keystore
          keytool -genkey -v -keystore release.keystore -alias alfykey -keyalg RSA -keysize 2048 -validity 10000 -storepass alfy123 -keypass alfy123 -dname "CN=Alfy, OU=Dev, O=Alfy, L=City, S=State, C=ID"
          
          # 2. Build dengan signing & ABI split
          gradle assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=alfy123 \
            -Pandroid.injected.signing.key.alias=alfykey \
            -Pandroid.injected.signing.key.password=alfy123

      - name: Cari APK arm64-v8a
        id: ver
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          # Cari APK khusus arm64-v8a
          APK=$(find . -path "*/release/*arm64-v8a*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::warning::APK arm64-v8a tidak ditemukan, mencoba cari APK universal..."
            APK=$(find . -path "*/release/*.apk" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::File APK tidak ditemukan."
            exit 1
          fi
          
          VN=$(grep -rhoE 'versionName *= *"[^"]+"' --include=build.gradle.kts --include=build.gradle . | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VN=${VN:-0}
          APP_NAME="AlfyDNS-arm64"
          cp "$APK" "$GITHUB_WORKSPACE/${APP_NAME}-v${VN}-${{ github.run_number }}.apk"
          echo "apk=${APP_NAME}-v${VN}-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=v${VN}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AlfyDNS-arm64-apk
          path: ${{ steps.ver.outputs.apk }}

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AlfyDNS ${{ steps.ver.outputs.tag }}
          files: ${{ steps.ver.outputs.apk }}
