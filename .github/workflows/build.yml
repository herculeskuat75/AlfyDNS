name: Build AlfyDNS (Export ZIP with New AAR)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan project dari ZIP
        shell: bash
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE/_src"
          mkdir -p "$SRC"
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Mengekstrak $ZIP..."
            unzip -o -q "$ZIP" -d "$SRC"
          fi
          ROOT=$(find "$SRC" -maxdepth 6 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' -printf '%d %h\n' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$ROOT" ]; then
            echo "::error::settings.gradle(.kts) tidak ditemukan di dalam ZIP."
            exit 1
          fi
          echo "Project root: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "SRC_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Clone SlipNet & Instal Gomobile
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git clone https://github.com/anonvector/SlipNet.git /tmp/SlipNet
          cd /tmp/SlipNet
          git config --global submodule.dnstt-mobile.update none
          git submodule update --init --recursive
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $HOME/go/bin/gomobile init

      - name: Build Golibs AAR (Target Full)
        run: |
          cd /tmp/SlipNet
          make -C gomobile-build build-full
          # Ganti AAR lama dengan yang baru (yang ada VayDNS-nya)
          cp app/libs/golibs-full.aar ${{ env.PROJECT_DIR }}/app/libs/golibs.aar

      - name: Bungkus Ulang Jadi ZIP Baru
        run: |
          cd ${{ env.SRC_DIR }}
          # Bungkus ulang semua isi proyek (termasuk AAR baru) ke dalam ZIP baru
          zip -r $GITHUB_WORKSPACE/AlfyDNS-With-VayDNS.zip .
          echo "ZIP baru berhasil dibuat."

      # Upload ZIP baru ke GitHub Release
      - name: Upload ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "vaydns-update-${{ github.run_number }}"
          name: "AlfyDNS with VayDNS AAR"
          files: ${{ github.workspace }}/AlfyDNS-With-VayDNS.zip
