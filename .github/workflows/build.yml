name: Build AlfyDNS with New Golibs

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ==========================================================
      # TAHAP 1: MERAKIT GOLIBS.AAR YANG BARU DARI SOURCE SLIPNET
      # ==========================================================
      - name: Clone SlipNet & Siapkan Go/gomobile
        run: |
          git clone https://github.com/anonvector/SlipNet.git /tmp/SlipNet
          cd /tmp/SlipNet
          # Inisialisasi submodule (penting untuk library Go-nya)
          git submodule update --init --recursive
          
          # Siapkan Go
          go version
          # Install gomobile
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Build Golibs AAR (Target Full)
        run: |
          cd /tmp/SlipNet
          # Jalankan perintah build-full sesuai Makefile resmi SlipNet
          make build-full
          
          # Salin hasilnya ke workspace proyek kita
          # Output aslinya adalah golibs-full.aar, kita rename jadi golibs.aar
          cp app/libs/golibs-full.aar $GITHUB_WORKSPACE/app/libs/golibs.aar

      # ==========================================================
      # TAHAP 2: BUILD APLIKASI ALFYDNS KAKAK
      # ==========================================================
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: ${{ github.workspace }}
        run: |
          # Build versi Release (bukan Debug) agar tidak kena error "Kehabisan ruang" (res=-18)
          gradle assembleRelease --no-daemon --stacktrace

      # ==========================================================
      # TAHAP 3: UPLOAD HASIL KE GITHUB RELEASE
      # ==========================================================
      - name: Cari APK dan tentukan nama dinamis
        id: ver
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::File APK tidak ditemukan setelah build."
            exit 1
          fi
          
          VN=$(grep -rhoE 'versionName *= *"[^"]+"' --include=build.gradle.kts --include=build.gradle . | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VN=${VN:-0}
          
          APP_NAME="AlfyDNS"
          cp "$APK" "$GITHUB_WORKSPACE/${APP_NAME}-v${VN}-${{ github.run_number }}.apk"
          echo "apk=${APP_NAME}-v${VN}-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=v${VN}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AlfyDNS-release-apk
          path: ${{ steps.ver.outputs.apk }}

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AlfyDNS ${{ steps.ver.outputs.tag }}
          files: ${{ steps.ver.outputs.apk }}
